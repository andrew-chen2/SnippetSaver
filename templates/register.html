{% extends 'auth_base.html' %}

{%block title %}SnippetSaver - Register{% endblock %}

{% block content %}
<div style="width: 350px;">
    <h3 style="margin-top: 0; margin-bottom: 20px; text-align: center">Register an Account</h3>
    <form action="/register" method="post">
        <div>
            <label for="username" class="form-label">Username</label>
            <input type="text" id="username" name="username" class="form-control" required />
        </div>
        <br />
        <div>
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" name="password" class="form-control" required />
        </div>
        <p style="color: red;">{{ error }}</p>
        <input type="submit" value="Register" class="btn btn-primary" style="width: 100%;" />
        <div style="display: flex; justify-content: center; gap: 5px; margin-top: 10px;">
            <span>Already have an account?</span>
            <a href="/login">Login</a>
        </div>
    </form>
</div>
{% endblock %}
