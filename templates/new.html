{% extends 'base.html' %}

{% block title %}New Snippet - SnippetSaver{% endblock %}

{% block content %}
<h2 class="card-title mb-4">Create a New Snippet</h2>

<form action="/new" method="post" enctype="multipart/form-data">
    <div class="mb-3">
        <label for="title" class="form-label">Title</label>
        <input type="text" class="form-control" id="title" name="title" placeholder="Enter a title for your snippet" required>
    </div>

    <div class="mb-3">
        <label for="language" class="form-label">Language</label>
        <select class="form-select" id="language" name="language" required>
            <option value="">Select a language...</option>
            <option value="python">Python</option>
            <option value="javascript">JavaScript</option>
            <option value="java">Java</option>
            <option value="cpp">C++</option>
            <option value="csharp">C#</option>
            <option value="html">HTML</option>
            <option value="other">Other</option>
        </select>
    </div>

    <div class="mb-3">
        <label for="code" class="form-label">Code</label>
        <div class="d-flex border rounded" style="height: 300px; overflow: hidden;">
            <textarea class="form-control border-0" id="code" name="code" 
                style="font-family: monospace; resize: none;" 
                placeholder="Paste or type your code snippet here..." required
            >
            </textarea>
        </div>
    </div>

    <div class="mb-3">
        <label for="fileUpload" class="form-label">Or upload a file</label>
        <input class="form-control" type="file" id="fileUpload" name="file" accept=".py,.js,.java,.cpp,.cs,.html,.txt">
    </div>

    <div class="d-flex justify-content-between mb-3">
        <div></div>
        <button type="submit" class="btn btn-primary">Save Snippet</button>
    </div>
</form>

<script>
    const textarea = document.getElementById('code');

    document.getElementById('fileUpload').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (file) {
            const text = await file.text();
            textarea.value = text;
            textarea.dispatchEvent(new Event('input'));
        }
    });
</script>
{% endblock %}
