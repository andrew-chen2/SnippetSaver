{% block title %}SnippetSaver - New Snippet{% endblock %}

{% block content %}
<h2 class="mb-3">Create a New Snippet</h2>

<form action="/new" method="post" enctype="multipart/form-data">
    <div class="d-flex mb-3 gap-3">
        <div class="flex-fill">
            <label for="title" class="form-label">Title (128 left)</label>
            <input type="text" class="form-control" id="title" name="title" placeholder="Enter a title for your snippet" maxlength="128" required>
        </div>
        <div>
            <label for="language" class="form-label">Language</label>
            <select class="form-select" id="language" name="language" required>
                <option value="">Select a language...</option>
                <option value="python">Python</option>
                <option value="javascript">JavaScript</option>
                <option value="java">Java</option>
                <option value="cpp">C++</option>
                <option value="csharp">C#</option>
                <option value="html">HTML</option>
                <option value="other">Other</option>
            </select>
        </div>
    </div>

    <div class="mb-3">
        <label for="code" class="form-label">Code (4000 characters left)</label>
        <div class="border rounded">
            <textarea class="form-control bg-light" id="code" name="code"></textarea>
        </div>
    </div>

    <div class="mb-3">
        <label for="fileUpload" class="form-label">Or upload a file</label>
        <input class="form-control" type="file" id="fileUpload" name="file" accept=".py,.js,.java,.cpp,.cs,.html,.txt">
    </div>

    <div class="d-flex justify-content-end mb-3">
        <button type="submit" class="btn btn-primary" id="submit" disabled="true">Save Snippet</button>
    </div>
</form>

<script>
    const textarea = document.getElementById('code');
    const select = document.getElementById('language');
    const submit = document.getElementById('submit');
    const title = document.getElementById('title');
    const titleLabel = document.querySelector('label[for="title"]');
    const codeLabel = document.querySelector('label[for="code"]');
    const modes = {
        python: "python",
        javascript: "javascript",
        java: "text/x-java",
        cpp: "text/x-c++src",
        csharp: "text/x-csharp",
        html: "htmlmixed",
        other: null,
        "": null
    };

    let editor = CodeMirror.fromTextArea(textarea, {
        lineNumbers: true,
        mode: null,
        theme: 'eclipse',
        placeholder: 'Paste or type your code snippet here...',
    });

    select.addEventListener('change', function (e) {
        editor.setOption('mode', modes[e.target.value]);
    });

    document.getElementById('fileUpload').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (file) {
            const text = await file.text();
            editor.setValue(text);
        }
    });

    editor.on('change', () => {
        submit.disabled = !editor.getValue().length;

        const remaining = 4000 - editor.getValue().length;
        codeLabel.textContent = `Code (${remaining} characters left)`;
    });

    editor.on('beforeChange', (instance, change) => {
        const newLength = instance.getValue().length + change.text.join('\n').length - (change.to.ch - change.from.ch);
        if (newLength > 4000) {
            change.cancel();
        }
    });

    title.addEventListener('input', (e) => {
        const remaining = 128 - e.target.value.length;
        titleLabel.textContent = `Title (${remaining} characters left)`;
    });
</script>
{% endblock %}
